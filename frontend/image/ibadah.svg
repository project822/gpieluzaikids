<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>
  <!-- Sun rays -->
  <g opacity="0.25" stroke="#fbbf24" stroke-width="6" stroke-linecap="round">
    <line x1="950" y1="210" x2="1080" y2="140"/><line x1="1010" y1="250" x2="1160" y2="230"/>
    <line x1="1020" y1="330" x2="1180" y2="360"/>
  </g>
  <circle cx="960" cy="270" r="60" fill="#fbbf24" opacity="0.9"/>
  <!-- Church silhouette -->
  <g fill="#1e1b4b" opacity="0.85">
    <rect x="380" y="330" width="360" height="380" rx="8"/>
    <polygon points="560,160 320,340 800,340"/>
    <polygon points="560,160 560,200 470,250 560,250 560,340"/>
  </g>
  <!-- Cross on top -->
  <g stroke="#fde68a" stroke-width="14" stroke-linecap="round" fill="none">
    <line x1="560" y1="110" x2="560" y2="180"/><line x1="525" y1="140" x2="595" y2="140"/>
  </g>
  <!-- Door -->
  <path d="M520 710 L520 520 Q560 470 600 520 L600 710 Z" fill="#0f172a"/>
  <!-- Kids silhouettes -->
  <g fill="#fde68a">
    <circle cx="300" cy="700" r="30"/><rect x="275" y="730" width="50" height="90" rx="22"/>
    <circle cx="840" cy="700" r="30"/><rect x="815" y="730" width="50" height="90" rx="22"/>
  </g>
  <circle cx="520" cy="650" r="28" fill="#fbcfe8"/><rect x="495" y="678" width="50" height="80" rx="22" fill="#fbcfe8"/>
  <circle cx="660" cy="650" r="28" fill="#a5f3fc"/><rect x="635" y="678" width="50" height="80" rx="22" fill="#a5f3fc"/>
  <!-- Ground -->
  <rect x="0" y="790" width="1200" height="110" fill="#0f172a" opacity="0.8"/>
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">Ibadah Sekolah Minggu</text>
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#e0e7ff">Gantilah dengan foto asli suasana gereja</text>
</svg>
