    <!-- dad -->
    <circle cx="400" cy="560" r="44" fill="#fde68a"/><rect x="356" y="604" width="88" height="140" rx="30" fill="#60a5fa"/>
    <!-- mom -->
    <circle cx="560" cy="550" r="42" fill="#fbcfe8"/><path d="M560 508 a42 42 0 0 1 42 30 l-84 0 a42 42 0 0 1 42 -30" fill="#f472b6"/>
    <rect x="520" y="600" width="80" height="140" rx="30" fill="#f472b6"/>
