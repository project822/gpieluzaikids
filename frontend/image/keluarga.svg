    <circle cx="200" cy="180" r="12" fill="#fde68a"/><circle cx="360" cy="120" r="10" fill="#fbcfe8"/>
    <circle cx="880" cy="140" r="12" fill="#bbf7d0"/><circle cx="1020" cy="230" r="10" fill="#c4b5fd"/>
    <rect x="520" y="110" width="16" height="16" rx="4" fill="#fca5a5" transform="rotate(30 528 118)"/>
    <rect x="700" y="90" width="14" height="14" rx="4" fill="#a5f3fc" transform="rotate(-20 707 97)"/>
  </g>
  <!-- Family group -->
