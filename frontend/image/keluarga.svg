  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">Keluarga Eluzai</text>
  <text x="600" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#fef3c7">Gantilah dengan foto asli suasana gereja</text>
