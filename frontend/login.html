<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/webp" href="/image/logo-placeholder.webp" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/login.css">
  </head>
  <body class="page-is-ready">
    <main class="container">
      <div class="auth-page" style="margin-top: 30px;">
        <div class="auth-card hover-expand" style="margin: 0 auto;">

          <div class="logo-wrap">
            <img
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cellipse cx='32' cy='26' rx='13' ry='16' fill='%23ffffff'/%3E%3Cellipse cx='27' cy='19' rx='4' ry='6' fill='rgba(255,255,255,0.55)'/%3E%3Cpath d='M32 42 L29 47 L35 47 Z' fill='%23ffffff'/%3E%3Cpath d='M32 47 C 27 52, 26 55, 29 58' fill='none' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
              alt="Logo"
              style="width: 56px; height: 56px; border-radius: 12px; display: inline-block; margin-bottom: 8px;"
            >
            <h1>Admin Login</h1>
          </div>

          <p class="error" id="login-error" data-error="" style="color: var(--accent-2); font-weight: 700; display: none;"></p>

          <form method="post" action="/admin/login">
            <div class="form-group" style="margin-bottom: 14px;">
              <label for="admin-username">Username</label>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 512 512" width="20" height="20" fill="currentColor" aria-hidden="true" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; opacity: 0.9; pointer-events: none; color: var(--muted);">
                  <path d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z"/>
                </svg>
                <input
                  id="admin-username"
                  type="text"
                  name="username"
                  placeholder="Username"
                  required
                  autocomplete="username"
                >
              </div>
            </div>

            <div class="form-group" style="margin-bottom: 14px;">
              <label for="admin-password">Password</label>
              <div class="input-with-icon">
                <svg class="input-icon" viewBox="0 0 512 512" width="20" height="20" fill="currentColor" aria-hidden="true" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; opacity: 0.9; pointer-events: none; color: var(--muted);">
                  <path d="M144 144v48H304V144c0-44.2-35.8-80-80-80s-80 35.8-80 80zm-64 48V144C80 64.5 144.5 0 224 0s144 64.5 144 144v48h16c35.3 0 64 28.7 64 64V448c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V256c0-35.3 28.7-64 64-64h16z"/>
                </svg>
                <input
                  id="admin-password"
                  type="password"
                  name="password"
                  placeholder="Password"
                  required
                  autocomplete="current-password"
                >
              </div>
            </div>

            <button class="submit-btn" type="submit">Login</button>
          </form>
        </div>
      </div>
    </main>

    <script>
      // Tampilkan pesan error (dari server via data-error, atau query ?error=)
      (function () {
        var el = document.getElementById("login-error");
        var serverErr = el.getAttribute("data-error");
        var err = serverErr || new URLSearchParams(window.location.search).get("error");
        if (err) {
          var msg = decodeURIComponent(err);
          el.textContent = msg;
          el.style.display = "block";
          // Alert hanya untuk pesan yang dikirim server (login gagal / rate limit)
          if (serverErr) alert("❌ " + msg);
        }
      })();
    </script>
  </body>
</html>
